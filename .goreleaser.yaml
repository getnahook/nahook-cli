version: 2

project_name: nahook

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: nahook
    main: ./cmd/nahook
    binary: nahook
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # Skip Windows on arm64 until there's actual demand.
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/getnahook/nahook-cli/internal/version.Version={{.Version}}
      - -X github.com/getnahook/nahook-cli/internal/version.Commit={{.ShortCommit}}
      - -X github.com/getnahook/nahook-cli/internal/version.Date={{.Date}}

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- if eq .Os "darwin" }}macos
      {{- else }}{{ .Os }}{{ end }}_
      {{- .Arch }}
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"

changelog:
  disable: true

release:
  draft: false
  prerelease: auto

# Homebrew tap auto-update. Each release pushes a new formula to
# getnahook/homebrew-tap so `brew install getnahook/tap/nahook` resolves
# the latest version without manual intervention. The tap repo must
# exist beforehand; the GitHub token used by the release workflow needs
# `contents:write` permission on it.
brews:
  - name: nahook
    repository:
      owner: getnahook
      name: homebrew-tap
      branch: main
      # HOMEBREW_TAP_TOKEN is a PAT with `contents:write` on the tap repo.
      # The default GITHUB_TOKEN is scoped to this repo only and can't
      # push to the tap, so the release workflow must inject this secret.
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://nahook.com
    description: "The Nahook command-line tool — trigger events, inspect deliveries, manage endpoints."
    license: MIT
    # Drop the formula into Formula/ at the tap root so brew can find it
    # at the canonical path.
    directory: Formula
    # `brew audit` runs this against the installed formula. `--version`
    # exercises the binary without needing credentials.
    test: |
      system "#{bin}/nahook", "--version"
    install: |
      bin.install "nahook"
      # Install shell completions generated by the binary so users get
      # tab-complete out of the box when they upgrade via brew.
      generate_completions_from_executable(bin/"nahook", "completion")
